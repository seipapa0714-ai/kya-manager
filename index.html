const ProgBar=({done,total,inProg=0})=>{
  if(!total)return null;
  return<div style={{height:3,background:"#E2E8F0",borderRadius:2,overflow:"hidden",marginTop:5}}><div style={{display:"flex",height:"100%"}}><div style={{width:`${(done/total)*100}%`,background:"#34D399",transition:"width 0.3s"}}/><div style={{width:`${(inProg/total)*100}%`,background:"#FBBF24",transition:"width 0.3s"}}/></div></div>;
};
/* 단계 진행 표시 (공통) */
const StageProg=({stage={},onToggle=null})=>(
  <div style={{display:"flex",alignItems:"flex-start",gap:0}}>
    {STAGES.map((s,i)=>{const st=stage[s]||"pending",sc=STAGE_ST[st];return(
      <div key={s} style={{display:"flex",alignItems:"center"}}>
        <div onClick={onToggle?()=>onToggle(s):undefined} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:onToggle?"pointer":"default"}}>
          <div style={{width:32,height:32,borderRadius:"50%",background:sc.bg,border:`1.5px solid ${sc.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:sc.color}}>{STAGE_ICON[st]}</div>
          <span style={{fontSize:10,color:sc.color,fontWeight:700,whiteSpace:"nowrap"}}>{STAGE_LBL[s]}</span>
          {onToggle&&<span style={{fontSize:9,color:sc.color,opacity:0.75}}>{sc.label}</span>}
        </div>
        {i<STAGES.length-1&&<div style={{width:20,height:2,background:stage[STAGES[i+1]]!=="pending"?`${sc.color}60`:"#E2E8F0",flexShrink:0,marginBottom:onToggle?20:14}}/>}
      </div>);})}
  </div>
);
/* 단계 컴팩트 표시 */
const StageCompact=({stage={}})=>{
  const cur=STAGES.slice().reverse().find(s=>stage[s]==="inprogress")||STAGES.slice().reverse().find(s=>stage[s]==="done")||null;
  if(!cur&&Object.values(stage).every(v=>v==="pending"))return null;
  const st=stage[cur||STAGES[0]]||"pending",sc=STAGE_ST[st];
  return<span style={{background:sc.bg,border:`1px solid ${sc.border}`,color:sc.color,fontSize:10,padding:"1px 6px",borderRadius:3,fontWeight:700,whiteSpace:"nowrap"}}>{STAGE_ICON[st]} {cur?STAGE_LBL[cur]:"-"}</span>;
};

/* ── 대분류 행 ── */
const ProjRow=({proj,subGroups,tasks,selected,onSelect,onEdit,onDelete,dailyCount=0})=>{
  const subs=subGroups.filter(s=>s.projectId===proj.id);

  const all=tasks.filter(t=>subIds.includes(t.subGroupId));
  const done=all.filter(t=>t.status==="done").length;
  const inProg=all.filter(t=>t.status==="inprogress").length;
  return(
    <div onClick={onSelect} style={{background:selected?"rgba(96,165,250,0.08)":"#FFFFFF",border:selected?"1px solid rgba(96,165,250,0.4)":"1px solid #E2E8F0",borderRadius:8,padding:"12px 11px",marginBottom:8,cursor:"pointer",transition:"all 0.12s",WebkitTapHighlightColor:"transparent",minHeight:56}}>

        </div>

          <button onClick={e=>{e.stopPropagation();onDelete(proj.id);}} style={{...sIBtn,color:"#F87171"}}><Trash2 size={11}/></button>

      </div>
    </div>
  );
};

const KanbanDailyForm=({init,projId,subId,projects,subGroups,onSave,onCancel})=>{
  const [f,setF]=useState({date:init?.date||todayStr(),content:init?.content||"",duration:init?.duration||"",progress:init?.progress||0});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const proj=projects.find(p=>p.id===projId);
  const sub=subGroups.find(s=>s.id===subId);
  const ok=f.content.trim();
  const handleSave=()=>{
    if(!ok)return;
    onSave({...f,id:init?.id||uid(),projId:projId||"",projText:proj?.name||"",subId:subId||"",subText:sub?.name||"",createdAt:init?.createdAt||new Date().toISOString()});
  };
  return(
    <div style={{background:"rgba(99,102,241,0.05)",border:"1px solid rgba(99,102,241,0.25)",borderRadius:10,padding:"10px 10px 8px",marginBottom:8}}>
      <div style={{display:"flex",gap:6,marginBottom:7}}>
        <input type="date" value={f.date} onChange={e=>set("date",e.target.value)} style={{...sInput,fontSize:11,padding:"4px 7px",flex:"0 0 130px"}}/>
        <input value={f.duration} onChange={e=>set("duration",e.target.value)} placeholder="⏱ 소요시간" style={{...sInput,fontSize:11,padding:"4px 7px",flex:1}}/>
      </div>
      <textarea value={f.content} onChange={e=>set("content",e.target.value)} placeholder="업무 내용을 입력하세요..." rows={2} style={{...sInput,resize:"none",fontSize:11,lineHeight:1.5,marginBottom:6}}/>
      <div style={{marginBottom:7}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <span style={{fontSize:10,color:"#64748B",fontWeight:600}}>진행률</span>
          <span style={{fontSize:11,fontWeight:700,color:PROG_COL(f.progress)}}>{PROG_LBL(f.progress)}</span>
          <span style={{fontSize:11,color:"#94A3B8",marginLeft:"auto"}}>{f.progress}%</span>
        </div>
        <input type="range" min="0" max="100" step="5" value={f.progress} onChange={e=>set("progress",Number(e.target.value))} style={{width:"100%",accentColor:PROG_COL(f.progress)}}/>
        <div style={{display:"flex",gap:4,marginTop:4}}>
          {[0,10,25,50,75,100].map(v=><button key={v} onClick={()=>set("progress",v)} style={{flex:1,background:f.progress===v?PROG_COL(v)+"22":"rgba(0,0,0,0.03)",border:`1px solid ${f.progress===v?PROG_COL(v)+"60":"#E2E8F0"}`,color:f.progress===v?PROG_COL(v):"#64748B",fontSize:10,padding:"2px 0",borderRadius:4,cursor:"pointer",fontWeight:f.progress===v?700:400}}>{v===0?"시작전":v===100?"완료":v+"%"}</button>)}
        </div>
      </div>
      <div style={{display:"flex",gap:5,justifyContent:"flex-end"}}>
        <button onClick={onCancel} style={{background:"rgba(0,0,0,0.04)",border:"1px solid #E2E8F0",color:"#64748B",padding:"4px 11px",borderRadius:6,cursor:"pointer",fontSize:11}}>취소</button>
        <button onClick={handleSave} style={{background:ok?"linear-gradient(135deg,#6366F1,#4F46E5)":"#E2E8F0",border:"none",color:ok?"#fff":"#94A3B8",padding:"4px 14px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:600}}>저장</button>
      </div>
    </div>
  );
};

          <div style={{flex:1,display:"flex",alignItems:"center",gap:5,overflow:"hidden",minWidth:0}}>

            {level>=1&&<span style={{color:"#1E293B",fontSize:15,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{selPO?.name}</span>}
            {level===1&&<span style={{color:"#A78BFA",fontSize:13,marginLeft:4,flexShrink:0,fontWeight:600}}>· 중분류</span>}
            {level===2&&<><span style={{color:"#CBD5E1",fontSize:16,flexShrink:0,marginLeft:2}}>›</span><span style={{color:"#1E293B",fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginLeft:4}}>{selSO?.name}</span></>}

            {projects.length===0&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"50px 0",lineHeight:1.8}}>📁 대분류를 추가하세요<br/><span style={{fontSize:11}}>상단 추가 버튼을 눌러주세요</span></div>}
            {CAT_ORDER.map(cat=><CatSection key={cat} cat={cat} projects={projects} subGroups={subGroups} tasks={tasks} selProjId={selProjId} setSelProjId={setSelProjId} setSelSubId={setSelSubId} onProjModal={onProjModal} onDelProj={onDelProj} dailies={dailies}/>)}
          </>}
          {level===1&&<>
            {filtSubs.length===0&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"50px 0",lineHeight:1.8}}>중분류를 추가하세요<br/><span style={{fontSize:11}}>상단 추가 버튼을 눌러주세요</span></div>}
            {filtSubs.map(sg=><SubRow key={sg.id} sg={sg} tasks={tasks} selected={selSubId===sg.id} onSelect={()=>setSelSubId(sg.id)} onEdit={()=>onSubModal(sg)} onDelete={()=>onDelSub(sg.id)}/>)}

      <div style={{borderRight:"1px solid #E2E8F0",display:"flex",flexDirection:"column",overflow:"hidden"}}>

      </div>
      <div style={{borderRight:"1px solid #E2E8F0",display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {colHdr("중분류","#7C3AED",selProjId?addBtn("#7C3AED",()=>onSubModal({projectId:selProjId}),"추가"):null)}
        <div style={{padding:"8px",overflowY:"auto",flex:1}}>
          {!selProjId&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"24px 0",lineHeight:1.7}}>← 대분류를<br/>선택하세요</div>}
          {selProjId&&filtSubs.length===0&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"24px 0",lineHeight:1.7}}>중분류를 추가하세요<br/><span style={{fontSize:10}}>예: 기구설계, 업체선정</span></div>}
          {filtSubs.map(sg=><SubRow key={sg.id} sg={sg} tasks={tasks} selected={selSubId===sg.id} onSelect={()=>setSelSubId(sg.id===selSubId?null:sg.id)} onEdit={()=>onSubModal(sg)} onDelete={()=>onDelSub(sg.id)}/>)}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* 컬럼 헤더: 소분류 + 버튼들 */}

          {/* 구분선 (업무와 일지 사이) */}
          {sorted.length>0&&colDailies.length>0&&<div style={{display:"flex",alignItems:"center",gap:8,margin:"10px 0 8px"}}><div style={{flex:1,height:1,background:"#E8E4FF"}}/><span style={{color:"#6366F1",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>📝 업무 일지</span><div style={{flex:1,height:1,background:"#E8E4FF"}}/></div>}

      {/* ── 4번째 컬럼: 전체 데일리 ── */}
      {(()=>{
        const td=todayStr();
        const ws=getWeek(new Date())[0];
        const DKRD4=["일","월","화","수","목","금","토"];
        const fmtD4=ds=>{const dt=toDate(ds);return`${dt.getMonth()+1}/${dt.getDate()}(${DKRD4[dt.getDay()]})`};
        const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return fmtD(d);};
        const recentCutoff=daysAgo(2); // 오늘~2일전 = 펼침

        // 완료 제외 필터 적용한 전체 목록
        const baseDailies=[...dailies].filter(d=>showCompleted||(d.progress||0)<100);
        // 시간 필터
        const filtered=baseDailies.filter(d=>{
          if(dailyAllFilter==="today")return d.date===td;
          if(dailyAllFilter==="week")return d.date>=ws&&d.date<=td;
          return true;
        });

        // 미완료 이월 항목 (과거 날짜, 진행률<100)
        const carryOvers=dailies.filter(d=>d.date<td&&(d.progress||0)<100);

        // 날짜별 그룹핑
        const byDate={};
        filtered.forEach(d=>{if(!byDate[d.date])byDate[d.date]=[];byDate[d.date].push({...d,_co:false});});
        // 오늘 그룹에 이월 항목 추가 (이미 없는 경우만)
        if(carryOvers.length>0&&(dailyAllFilter==="all"||dailyAllFilter==="today")){
          if(!byDate[td])byDate[td]=[];
          carryOvers.forEach(co=>{
            if(!byDate[td].find(e=>e.id===co.id&&!e._co))
              byDate[td].unshift({...co,_co:true});
          });
        }
        const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));

        const toggleDate=date=>{
          setExpandedDates(prev=>{const s=new Set(prev);s.has(date)?s.delete(date):s.add(date);return s;});
        };

        const DailyCard=({d,isCarryOver})=>{
          const proj=projects.find(p=>p.id===d.projId);
          const sub=subGroups.find(s=>s.id===d.subId);
          const pc=PROG_COL(d.progress||0);
          const pl=PROG_LBL(d.progress||0);

            <KanbanDailyForm key={d.id} init={d} projId={d.projId} subId={d.subId} projects={projects} subGroups={subGroups}

          );
          return(
            <div style={{background:isCarryOver?"rgba(245,158,11,0.04)":"#fff",border:`1px solid ${isCarryOver?"rgba(245,158,11,0.3)":"#E8E4FF"}`,borderLeft:`3px solid ${pc}`,borderRadius:8,padding:"8px 10px",marginBottom:5}}>
              <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3,flexWrap:"wrap"}}>
                {isCarryOver&&<span style={{fontSize:9,background:"rgba(245,158,11,0.15)",color:"#D97706",padding:"1px 4px",borderRadius:3,fontWeight:700,flexShrink:0}}>🔄 이월 {fmtD4(d.date)}</span>}
                {proj&&<span style={{fontSize:10,fontWeight:700,color:(CATS[proj.category]||CATS.project).color,background:(CATS[proj.category]||CATS.project).bg,padding:"1px 5px",borderRadius:3,maxWidth:90,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{proj.name}</span>}
                {sub&&<span style={{fontSize:10,color:"#94A3B8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>/ {sub.name}</span>}

                  <button onClick={()=>{setAddingDailyAll(false);setEditDailyAllId(d.id);}} style={{...sIBtn,padding:3,color:"#6366F1"}}><Edit2 size={11}/></button>
                  <button onClick={()=>{if(onDelDaily)onDelDaily(d.id);}} style={{...sIBtn,padding:3,color:"#F87171"}}><Trash2 size={11}/></button>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,margin:"4px 0"}}>
                <div style={{flex:1,height:5,background:"#F1F5F9",borderRadius:3,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${d.progress||0}%`,background:pc,borderRadius:3}}/>
                </div>
                <span style={{fontSize:10,fontWeight:700,color:pc,whiteSpace:"nowrap"}}>{d.progress||0}% {pl}</span>
              </div>
              <div style={{fontSize:11,color:"#334155",lineHeight:1.4,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{d.content}</div>
              {d.duration&&<span style={{fontSize:10,color:"#94A3B8",marginTop:3,display:"block"}}>⏱ {d.duration}</span>}
            </div>
          );
        };

        return(
          <div style={{borderLeft:"2px solid #E2E8F0",display:"flex",flexDirection:"column",overflow:"hidden",background:"#FAFBFF"}}>
            {/* 헤더 */}
            <div style={{padding:"10px 12px 8px",borderBottom:"1px solid #E2E8F0",background:"#F8FAFC",flexShrink:0}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                <span style={{color:"#F59E0B",fontSize:11,fontWeight:700,letterSpacing:"0.8px",textTransform:"uppercase"}}>📋 데일리</span>
                <div style={{display:"flex",gap:4}}>
                  <button onClick={()=>setShowCompleted(s=>!s)} style={{background:showCompleted?"rgba(16,185,129,0.12)":"rgba(0,0,0,0.04)",border:`1px solid ${showCompleted?"#10B981":"#E2E8F0"}`,color:showCompleted?"#10B981":"#94A3B8",fontSize:10,padding:"2px 7px",borderRadius:4,cursor:"pointer",fontWeight:showCompleted?700:400}}>
                    ✅ {showCompleted?"완료 숨기기":"완료 보기"}
                  </button>
                  <button onClick={()=>{setEditDailyAllId(null);setAddingDailyAll(a=>!a);}} style={{background:"rgba(245,158,11,0.12)",border:"1px solid rgba(245,158,11,0.3)",color:"#D97706",fontSize:10,padding:"2px 8px",borderRadius:4,cursor:"pointer",fontWeight:700}}>+ 추가</button>
                </div>
              </div>
              <div style={{display:"flex",gap:4}}>
                {["all","today","week"].map((f,i)=>{const l=["전체","오늘","이번주"][i];return(<button key={f} onClick={()=>setDailyAllFilter(f)} style={{flex:1,background:dailyAllFilter===f?"#F59E0B":"rgba(0,0,0,0.03)",border:`1px solid ${dailyAllFilter===f?"#F59E0B":"#E2E8F0"}`,color:dailyAllFilter===f?"#fff":"#64748B",fontSize:10,padding:"3px 0",borderRadius:5,cursor:"pointer",fontWeight:dailyAllFilter===f?700:400}}>{l}</button>);})}
              </div>
            </div>
            {/* 본문 */}
            <div style={{overflowY:"auto",flex:1,padding:"8px 10px"}}>
              {addingDailyAll&&<KanbanDailyForm projId={selProjId||""} subId={selSubId||""} projects={projects} subGroups={subGroups} onSave={e=>{if(onSaveDaily)onSaveDaily(e);setAddingDailyAll(false);}} onCancel={()=>setAddingDailyAll(false)}/>}
              {dates.length===0&&!addingDailyAll&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"32px 0",lineHeight:1.8}}>📋 기록된 일지가 없어요<br/><span style={{fontSize:10}}>+ 추가로 일지를 작성하세요</span></div>}
              {dates.map(date=>{
                const isToday=date===td;
                const isRecent=date>=recentCutoff;
                const isExpanded=isRecent||expandedDates.has(date);
                const entries=byDate[date];
                const coEntries=entries.filter(e=>e._co);
                const normEntries=entries.filter(e=>!e._co);
                const totalCnt=entries.length;
                const avgProg=Math.round(entries.reduce((s,e)=>s+(e.progress||0),0)/Math.max(1,totalCnt));
                const pc4=PROG_COL(avgProg);
                return(
                  <div key={date} style={{marginBottom:10}}>
                    {/* 날짜 헤더 */}
                    <div onClick={isRecent?undefined:()=>toggleDate(date)}
                      style={{display:"flex",alignItems:"center",gap:6,marginBottom:isExpanded?6:3,padding:"4px 5px",borderRadius:6,background:isToday?"rgba(245,158,11,0.06)":"rgba(0,0,0,0.02)",cursor:isRecent?"default":"pointer",userSelect:"none"}}>
                      {!isRecent&&<span style={{fontSize:9,color:"#94A3B8"}}>{isExpanded?"▼":"▶"}</span>}
                      <span style={{fontSize:11,fontWeight:700,color:isToday?"#D97706":isRecent?"#475569":"#94A3B8"}}>
                        {fmtD4(date)}{isToday?" 오늘":""}
                      </span>
                      {coEntries.length>0&&<span style={{fontSize:9,background:"rgba(245,158,11,0.18)",color:"#D97706",padding:"1px 5px",borderRadius:3,fontWeight:700}}>🔄 이월 {coEntries.length}건</span>}
                      <div style={{flex:1,height:4,background:"#F1F5F9",borderRadius:2,overflow:"hidden",marginLeft:2}}>
                        <div style={{height:"100%",width:`${avgProg}%`,background:pc4,borderRadius:2}}/>
                      </div>
                      <span style={{fontSize:10,fontWeight:700,color:pc4,whiteSpace:"nowrap",flexShrink:0}}>{avgProg}%</span>
                      {!isRecent&&!isExpanded&&<span style={{fontSize:9,color:"#94A3B8",flexShrink:0}}>{totalCnt}건</span>}
                    </div>
                    {/* 항목들 */}
                    {isExpanded&&<>
                      {coEntries.map(d=><DailyCard key={"co"+d.id} d={d} isCarryOver={true}/>)}
                      {normEntries.map(d=><DailyCard key={d.id} d={d} isCarryOver={false}/>)}
                    </>}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
    </div>
  );
};

const SchedItem=({task,subGroups,projects,onEdit})=>{
  const sg=subGroups.find(s=>s.id===task.subGroupId);
  const proj=sg?projects.find(p=>p.id===sg.projectId):null;
  const cat=proj?.category||"project";
  const c=CATS[cat]||CATS.project;
  const d=getDday(task.deadline);
  return(
    <div onClick={()=>onEdit(task)} style={{background:"#FFFFFF",border:"1px solid #E2E8F0",borderLeft:`3px solid ${task.isMeeting?"#A78BFA":c.color}`,borderRadius:8,padding:"8px 12px",marginBottom:6,cursor:"pointer",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
      {proj&&<span style={{background:c.bg,border:`1px solid ${c.border}`,color:c.color,fontSize:11,padding:"2px 7px",borderRadius:4,fontWeight:600,whiteSpace:"nowrap"}}>{c.icon} {proj.name}</span>}
      {sg&&<span style={{color:"#94A3B8",fontSize:11,whiteSpace:"nowrap"}}>/ {sg.name}</span>}
      {task.isMeeting&&<span style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.25)",color:"#7C3AED",fontSize:10,padding:"1px 5px",borderRadius:3,fontWeight:700,flexShrink:0}}>📅 회의</span>}

      {task.meetingTime&&<span style={{color:"#7C3AED",fontSize:11,flexShrink:0}}>🕐 {task.meetingTime}</span>}
      {d!==null&&<span style={{color:ddayCl(d),fontSize:11,fontFamily:"monospace",fontWeight:d<=3?600:400,flexShrink:0}}>{fmtDday(d)}</span>}

/* ── 회의/일정 뷰 ── */
const MeetingView=({tasks,subGroups,projects,schedules,onEditTask,onSchedModal,onDelSched,isMobile=false})=>{
  const [meetingPane,setMeetingPane]=useState("meetings");
  const meetings=tasks.filter(t=>t.isMeeting);

    grouped[key].items.push({task:t,sg});

    <div style={{display:isMobile?"block":"grid",gridTemplateColumns:"1fr 340px",gap:0,height:isMobile?"auto":"calc(100vh - 116px)"}}>

      {/* 회의 목록 */}
      <div style={{borderRight:isMobile?"none":"1px solid #E2E8F0",overflowY:"auto",padding:"0 14px",display:isMobile&&meetingPane!=="meetings"?"none":"block"}}>

        {meetings.length===0&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"40px 0"}}>소분류에서 📅 회의로 등록된 항목이 표시됩니다</div>}
        {Object.values(grouped).map(({proj,items})=>(
          <div key={proj?.id||"none"} style={{marginBottom:18}}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:8,paddingBottom:6,borderBottom:"1px solid #F1F5F9"}}>
              {proj?<CatBadge cat={proj.category}/>:<span style={{color:"#94A3B8",fontSize:12}}>미분류</span>}
              {proj&&<span style={{color:"#334155",fontSize:13,fontWeight:600}}>{proj.name}</span>}
              {proj?.stage&&<StageCompact stage={proj.stage}/>}
            </div>
            {items.sort((a,b)=>{if(!a.task.deadline)return 1;if(!b.task.deadline)return-1;return a.task.deadline.localeCompare(b.task.deadline);}).map(({task,sg})=>{
              const d=getDday(task.deadline);
              const isDone=task.status==="done";
              return(
                <div key={task.id} onClick={()=>onEditTask(task)} style={{background:isDone?"rgba(52,211,153,0.04)":"#FFFFFF",border:`1px solid ${isDone?"rgba(52,211,153,0.15)":"#E2E8F0"}`,borderLeft:`3px solid ${isDone?"#34D399":"#A78BFA"}`,borderRadius:8,padding:"9px 12px",marginBottom:6,cursor:"pointer",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>

                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>

    <div style={{background:"#FFFFFF",border:"1px solid #E2E8F0",borderLeft:`3px solid ${projName?c.color:"#E2E8F0"}`,borderRadius:8,padding:"10px 13px",marginBottom:7}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:entry.content?6:0}}>

};

/* ── 데일리 뷰 ── */
const DailyView=({dailies,onSave,onDelete,projs,subs,isMobile=false})=>{
  const [mobilePane,setMobilePane]=useState("daily");
  const [curDate,setCurDate]=useState(todayStr());
  const [adding,setAdding]=useState(false);
  const [editId,setEditId]=useState(null);
  const [weekBase,setWeekBase]=useState(new Date());
  const weekDays=getWeek(weekBase);
  const dayEntries=dailies.filter(d=>d.date===curDate).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  const kd=["일","월","화","수","목","금","토"];
  const curDt=toDate(curDate);
  const dayLabel=`${curDt.getFullYear()}년 ${curDt.getMonth()+1}월 ${curDt.getDate()}일 (${kd[curDt.getDay()]})`;
  const navDay=dir=>{const d=new Date(curDate+"T00:00:00");d.setDate(d.getDate()+dir);const nd=fmtD(d);setCurDate(nd);if(!weekDays.includes(nd))setWeekBase(d);};
  const navWeek=dir=>{const d=new Date(weekBase);d.setDate(d.getDate()+dir*7);setWeekBase(d);};
  const goToday=()=>{setCurDate(todayStr());setWeekBase(new Date());};
  const handleSave=entry=>{onSave(entry);setAdding(false);setEditId(null);};
  const weekTotal=weekDays.reduce((a,d)=>a+dailies.filter(x=>x.date===d).length,0);
  const weekWorkDays=weekDays.filter(d=>dailies.some(x=>x.date===d)).length;
  return(
    <div style={{display:isMobile?"flex":"grid",flexDirection:isMobile?"column":"row",gridTemplateColumns:isMobile?"":"1fr 300px",height:isMobile?"auto":"calc(100vh - 116px)",overflowX:isMobile?"":"auto"}}>
      {isMobile&&<div style={{display:"flex",borderBottom:"1px solid #E2E8F0",background:"#F8FAFC",flexShrink:0}}><button onClick={()=>setMobilePane("daily")} style={{flex:1,padding:"11px",color:mobilePane==="daily"?"#2563EB":"#64748B",borderBottom:mobilePane==="daily"?"2px solid #2563EB":"2px solid transparent",fontWeight:mobilePane==="daily"?700:400,fontSize:13,background:"none",border:"none",cursor:"pointer",borderBottom:mobilePane==="daily"?"2px solid #2563EB":"2px solid transparent"}}>📝 일간</button><button onClick={()=>setMobilePane("weekly")} style={{flex:1,padding:"11px",color:mobilePane==="weekly"?"#2563EB":"#64748B",fontWeight:mobilePane==="weekly"?700:400,fontSize:13,background:"none",border:"none",cursor:"pointer",borderBottom:mobilePane==="weekly"?"2px solid #2563EB":"2px solid transparent"}}>📆 주간</button></div>}
      {/* ── 왼쪽: 일간 업무 ── */}
      <div style={{borderRight:isMobile?"none":"1px solid #E2E8F0",overflowY:"auto",padding:"0 16px",display:isMobile&&mobilePane!=="daily"?"none":"block"}}>
        {/* 날짜 네비게이션 */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,paddingTop:2,flexWrap:"wrap"}}>
          <button onClick={()=>navDay(-1)} style={{...sIBtn,padding:5,border:"1px solid #E2E8F0",borderRadius:6,color:"#64748B"}}><ChevL size={14}/></button>
          <span style={{color:"#1E293B",fontSize:14,fontWeight:700,flex:1,minWidth:180}}>{dayLabel}</span>
          <button onClick={()=>navDay(1)} style={{...sIBtn,padding:5,border:"1px solid #E2E8F0",borderRadius:6,color:"#64748B"}}><ChevR size={14}/></button>
          <button onClick={goToday} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",color:"#2563EB",fontSize:11,padding:"4px 10px",borderRadius:6,cursor:"pointer"}}>오늘</button>
        </div>
        {/* 추가 버튼 */}
        {!adding&&!editId&&<button onClick={()=>setAdding(true)} style={{width:"100%",background:"rgba(59,130,246,0.04)",border:"1px dashed rgba(59,130,246,0.25)",color:"#2563EB",padding:"9px",borderRadius:8,cursor:"pointer",fontSize:13,marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><Plus size={14}/>업무 추가</button>}
        {adding&&<DailyForm init={{date:curDate}} date={curDate} projs={projs} subs={subs} onSave={handleSave} onCancel={()=>setAdding(false)}/>}
        {/* 엔트리 목록 */}
        {dayEntries.length===0&&!adding&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"36px 0",lineHeight:1.8}}>📝 오늘 한 업무를 기록해보세요<br/><span style={{fontSize:11}}>업무 추가 버튼을 눌러 시작하세요</span></div>}
        {dayEntries.map(entry=>(
          editId===entry.id?(
            <DailyForm key={entry.id} init={entry} date={curDate} projs={projs} subs={subs} onSave={handleSave} onCancel={()=>setEditId(null)}/>
          ):(
            <DailyEntry key={entry.id} entry={entry} projs={projs} subs={subs} onEdit={e=>{setEditId(e.id);setAdding(false);}} onDelete={()=>onDelete(entry.id)}/>
          )
        ))}
      </div>
      {/* ── 오른쪽: 주간 요약 ── */}
      <div style={{overflowY:"auto",padding:isMobile?"0 12px":"0 14px",display:isMobile&&mobilePane!=="weekly"?"none":"block",borderTop:isMobile?"1px solid #E2E8F0":"none"}}>
        {/* 주 네비게이션 */}
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12,paddingTop:2}}>
          <button onClick={()=>navWeek(-1)} style={{...sIBtn,padding:4,border:"1px solid #E2E8F0",borderRadius:5}}><ChevL size={13}/></button>

          <button onClick={()=>navWeek(1)} style={{...sIBtn,padding:4,border:"1px solid #E2E8F0",borderRadius:5}}><ChevR size={13}/></button>
        </div>
        {weekDays.map((day,i)=>{
          const entries=dailies.filter(d=>d.date===day);
          const dt=toDate(day),isToday=day===todayStr(),isCur=day===curDate,isW=i===0||i===6;
          return(
            <div key={day} onClick={()=>{setCurDate(day);}} style={{background:isCur?"rgba(59,130,246,0.06)":"rgba(0,0,0,0.01)",border:`1px solid ${isCur?"rgba(59,130,246,0.2)":"#E2E8F0"}`,borderRadius:8,padding:"9px 11px",marginBottom:5,cursor:"pointer",transition:"all 0.12s"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:entries.length>0?5:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{color:isW?"#F87171":"#94A3B8",fontSize:11,fontWeight:600,width:16,flexShrink:0}}>{WDAY_LBL[i]}</span>
                  <span style={{color:isCur?"#2563EB":isToday?"#2563EB":isW?"#F87171":"#334155",fontSize:13,fontWeight:isCur||isToday?700:400,fontFamily:"monospace"}}>{dt.getMonth()+1}/{dt.getDate()}</span>
                  {isToday&&<span style={{background:"rgba(59,130,246,0.1)",color:"#2563EB",fontSize:9,padding:"1px 4px",borderRadius:3,fontWeight:700}}>오늘</span>}
                </div>
                <span style={{background:entries.length>0?"rgba(59,130,246,0.1)":"rgba(0,0,0,0.04)",color:entries.length>0?"#2563EB":"#CBD5E1",fontSize:11,fontWeight:700,padding:"1px 7px",borderRadius:10}}>{entries.length}</span>
              </div>
              {entries.slice(0,2).map(e=>{const pj=e.projId?projs.find(p=>p.id===e.projId):null;const pjN=pj?.name||e.projText;const pc=(CATS[pj?.category]||CATS.project);return(
                <div key={e.id} style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
                  {pjN&&<span style={{color:pc.color,fontSize:10,flexShrink:0}}>{pc.icon}</span>}
                  <span style={{color:"#475569",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.content.split('\n')[0].slice(0,28)}{e.content.length>28?"...":""}</span>
                </div>);})}
              {entries.length>2&&<div style={{color:"#94A3B8",fontSize:10}}>외 {entries.length-2}건...</div>}
            </div>
          );
        })}
        {/* 주간 통계 */}
        <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:"11px 12px",marginTop:8}}>
          <div style={{color:"#64748B",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:7}}>주간 요약</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
            <span style={{color:"#1E293B",fontSize:20,fontWeight:700}}>{weekTotal}<span style={{fontSize:12,color:"#94A3B8",fontWeight:400,marginLeft:3}}>건</span></span>
            <span style={{color:"#64748B",fontSize:12}}>{weekWorkDays}일 기록</span>
          </div>
          {weekWorkDays>0&&<div style={{marginTop:8,height:4,background:"#E2E8F0",borderRadius:2,overflow:"hidden"}}><div style={{width:`${(weekWorkDays/5)*100}%`,maxWidth:"100%",height:"100%",background:"linear-gradient(90deg,#2563EB,#4F46E5)",borderRadius:2,transition:"width 0.3s"}}/></div>}
          {weekTotal>0&&(()=>{
            const projCounts={};
            weekDays.forEach(d=>dailies.filter(x=>x.date===d).forEach(e=>{const pj=e.projId?projs.find(p=>p.id===e.projId):null;const k=pj?.name||e.projText||"기타";projCounts[k]=(projCounts[k]||0)+1;}));
            const top=Object.entries(projCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
            return top.length>0?(<div style={{marginTop:10}}>{top.map(([n,cnt])=>(<div key={n} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"3px 0",borderBottom:"1px solid #F1F5F9"}}><span style={{color:"#475569",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginRight:8}}>{n}</span><span style={{color:"#2563EB",fontSize:11,fontWeight:700,flexShrink:0}}>{cnt}건</span></div>))}</div>):null;
          })()}
        </div>
      </div>
    </div>
  );
};

/* ── 메인 앱 ── */
function App(){
  const [projs,setProjs]=useState([]);
  const [subs,setSubs]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [vendors,setVendors]=useState([]);
  const [schedules,setSchedules]=useState([]);
  const [dailies,setDailies]=useState([]);
  const [view,setView]=useState("kanban");
  const [catF,setCatF]=useState("all");
  const [selP,setSelP]=useState(null);
  const [selS,setSelS]=useState(null);
  const [pModal,setPModal]=useState(null);
  const [sModal,setSModal]=useState(null);
  const [tModal,setTModal]=useState(null);
  const [vModal,setVModal]=useState(null);
  const [schModal,setSchModal]=useState(null);
  const [loading,setLoading]=useState(true);
  const [syncStatus,setSyncStatus]=useState("idle"); // idle|saving|saved|error
  const fbTimer=useRef(null);
  const checkMobile=()=>window.innerWidth<1024||"ontouchstart" in window||navigator.maxTouchPoints>0;
  const [isMobile,setIsMobile]=useState(checkMobile);
  useEffect(()=>{const h=()=>setIsMobile(checkMobile());window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);

  useEffect(()=>{
    (async()=>{
      // ① 먼저 localStorage에서 즉시 로딩
      const ls={};
      try{
        const p=localStorage.getItem("gd_projs_v1"),s=localStorage.getItem("gd_subs_v1"),
              t=localStorage.getItem("gd_tasks_v3"),v=localStorage.getItem("gd_vendors_v1"),
              sc=localStorage.getItem("gd_schedules_v1"),dl=localStorage.getItem("gd_dailies_v1");
        if(p){const d=JSON.parse(p);setProjs(d);ls.projs=d;}
        if(s){const d=JSON.parse(s);setSubs(d);ls.subs=d;}
        if(t){const d=JSON.parse(t);setTasks(d);ls.tasks=d;}
        if(v){const d=JSON.parse(v);setVendors(d);ls.vendors=d;}
        if(sc){const d=JSON.parse(sc);setSchedules(d);ls.schedules=d;}
        if(dl){const d=JSON.parse(dl);setDailies(d);ls.dailies=d;}
      }catch(le){}
      // ② Firebase 로딩 (있으면 덮어씀, 없으면 localStorage를 Firebase에 업로드)
      try{
        const res=await fetch(FB_URL);
        const fb=await res.json();
        if(fb&&typeof fb==="object"&&(Array.isArray(fb.projs)||Array.isArray(fb.subs)||Array.isArray(fb.tasks))){
          if(Array.isArray(fb.projs))setProjs(fb.projs);
          if(Array.isArray(fb.subs))setSubs(fb.subs);
          if(Array.isArray(fb.tasks))setTasks(fb.tasks);
          if(Array.isArray(fb.vendors))setVendors(fb.vendors);
          if(Array.isArray(fb.schedules))setSchedules(fb.schedules);
          if(Array.isArray(fb.dailies))setDailies(fb.dailies);
        }else if(Object.keys(ls).length>0){
          // Firebase 비어있는데 localStorage에 데이터 있으면 Firebase에 업로드
          await fetch(FB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({projs:ls.projs||[],subs:ls.subs||[],tasks:ls.tasks||[],vendors:ls.vendors||[],schedules:ls.schedules||[],dailies:ls.dailies||[]})});
        }
      }catch(e){}
      setLoading(false);
    })();
  },[]);

  // 데이터 변경 시 Firebase 자동 저장 (1초 디바운스)
  useEffect(()=>{
    if(loading)return;
    setSyncStatus("saving");
    clearTimeout(fbTimer.current);
    fbTimer.current=setTimeout(async()=>{
      try{
        await fetch(FB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({projs,subs,tasks,vendors,schedules,dailies})});
        setSyncStatus("saved");
        // localStorage 백업도 동시 저장
        try{localStorage.setItem("gd_projs_v1",JSON.stringify(projs));localStorage.setItem("gd_subs_v1",JSON.stringify(subs));localStorage.setItem("gd_tasks_v3",JSON.stringify(tasks));localStorage.setItem("gd_vendors_v1",JSON.stringify(vendors));localStorage.setItem("gd_schedules_v1",JSON.stringify(schedules));localStorage.setItem("gd_dailies_v1",JSON.stringify(dailies));}catch(le){}
      }catch(e){
        setSyncStatus("error");
      }
    },1000);
    return()=>clearTimeout(fbTimer.current);
  },[projs,subs,tasks,vendors,schedules,dailies,loading]);

  const pp=a=>{try{localStorage.setItem("gd_projs_v1",JSON.stringify(a));}catch(e){}};
  const ps=a=>{try{localStorage.setItem("gd_subs_v1",JSON.stringify(a));}catch(e){}};
  const pt=a=>{try{localStorage.setItem("gd_tasks_v3",JSON.stringify(a));}catch(e){}};
  const pv=a=>{try{localStorage.setItem("gd_vendors_v1",JSON.stringify(a));}catch(e){}};
  const psc=a=>{try{localStorage.setItem("gd_schedules_v1",JSON.stringify(a));}catch(e){}};
  const pdl=a=>{try{localStorage.setItem("gd_dailies_v1",JSON.stringify(a));}catch(e){}};

  const saveProj=p=>{const n=!projs.find(x=>x.id===p.id)?[...projs,p]:projs.map(x=>x.id===p.id?p:x);setProjs(n);pp(n);setPModal(null);};
  const delProj=id=>{if(!confirm("대분류와 모든 하위 업무가 삭제됩니다."))return;const dIds=subs.filter(s=>s.projectId===id).map(s=>s.id);const nt=tasks.filter(t=>!dIds.includes(t.subGroupId));const ns=subs.filter(s=>s.projectId!==id);const np=projs.filter(p=>p.id!==id);setProjs(np);pp(np);setSubs(ns);ps(ns);setTasks(nt);pt(nt);if(selP===id){setSelP(null);setSelS(null);}};
  const saveSub=s=>{const n=!subs.find(x=>x.id===s.id)?[...subs,s]:subs.map(x=>x.id===s.id?s:x);setSubs(n);ps(n);setSModal(null);};
  const delSub=id=>{if(!confirm("중분류와 모든 소분류가 삭제됩니다."))return;const nt=tasks.filter(t=>t.subGroupId!==id);const ns=subs.filter(s=>s.id!==id);setSubs(ns);ps(ns);setTasks(nt);pt(nt);if(selS===id)setSelS(null);};
  const saveTask=t=>{const n=!tasks.find(x=>x.id===t.id)?[...tasks,t]:tasks.map(x=>x.id===t.id?t:x);setTasks(n);pt(n);setTModal(null);};
  const delTask=id=>{if(!confirm("삭제하시겠습니까?"))return;const n=tasks.filter(t=>t.id!==id);setTasks(n);pt(n);};
  const moveTask=(id,status)=>{const n=tasks.map(t=>t.id===id?{...t,status}:t);setTasks(n);pt(n);};
  const saveVendor=v=>{const n=!vendors.find(x=>x.id===v.id)?[...vendors,v]:vendors.map(x=>x.id===v.id?v:x);setVendors(n);pv(n);setVModal(null);};
  const delVendor=id=>{if(!confirm("협력업체를 삭제하시겠습니까?"))return;const n=vendors.filter(v=>v.id!==id);setVendors(n);pv(n);};
  const saveSched=s=>{const n=!schedules.find(x=>x.id===s.id)?[...schedules,s]:schedules.map(x=>x.id===s.id?s:x);setSchedules(n);psc(n);setSchModal(null);};
  const delSched=id=>{if(!confirm("삭제하시겠습니까?"))return;const n=schedules.filter(s=>s.id!==id);setSchedules(n);psc(n);};
  const saveDailyEntry=e=>{const n=!dailies.find(x=>x.id===e.id)?[...dailies,e]:dailies.map(x=>x.id===e.id?e:x);setDailies(n);pdl(n);};
  const delDailyEntry=id=>{if(!confirm("삭제하시겠습니까?"))return;const n=dailies.filter(d=>d.id!==id);setDailies(n);pdl(n);};

  const filProjs=catF==="all"?projs:projs.filter(p=>p.category===catF);
  const filTasks=tasks.filter(t=>{const sg=subs.find(s=>s.id===t.subGroupId);if(!sg)return false;return catF==="all"||filProjs.some(p=>p.id===sg.projectId);});

  const totalT=tasks.length,meetingN=tasks.filter(t=>t.isMeeting).length,todayDailyN=dailies.filter(d=>d.date===todayStr()).length;
  const overdueN=tasks.filter(t=>t.status!=="done"&&t.deadline&&getDday(t.deadline)<0).length;
  const todayN=tasks.filter(t=>t.status!=="done"&&t.deadline===todayStr()).length;

  const getCtx=t=>{const sg=subs.find(s=>s.id===t.subGroupId);const pj=sg?projs.find(p=>p.id===sg.projectId):null;return{sgName:sg?.name,projName:pj?.name};};

  const TABS=[["kanban","⊞  칸반"],["schedule","📅  일정"],["meeting","🗓  회의/일정"],["daily","📝  데일리"],["vendor","🏭  협력업체"]];

  if(loading)return<div style={{background:"#F0F4F9",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,color:"#94A3B8",fontFamily:"system-ui"}}><div style={{width:32,height:32,border:"3px solid #E2E8F0",borderTop:"3px solid #2563EB",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/><style>{"@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}"}</style><span style={{fontSize:13}}>Firebase에서 불러오는 중...</span></div>;

  const tCtx=tModal?getCtx(tModal):{};

  return(
    <div style={{background:"#F0F4F9",minHeight:"100vh",fontFamily:"'Noto Sans KR',sans-serif",color:"#1E293B"}}>
      {/* ── 헤더 ── */}
      <div style={{display:"flex",alignItems:"center",padding:isMobile?"7px 10px":"9px 14px",borderBottom:"1px solid #E2E8F0",background:"#FFFFFF",gap:isMobile?6:10,flexWrap:"wrap",position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <div style={{marginRight:4,flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:16}}>⚙️</span>
            <span style={{color:"#0F172A",fontSize:14,fontWeight:700,letterSpacing:"0.3px"}}>유안 업무</span>
          </div>
          <div style={{display:"flex",gap:8,marginTop:1}}>
            <span style={{color:"#CBD5E1",fontSize:10,fontFamily:"monospace"}}>업무 {totalT} · 업체 {vendors.length}</span>
            {meetingN>0&&<span style={{color:"#7C3AED",fontSize:10}}>📅 회의 {meetingN}건</span>}{todayDailyN>0&&<span style={{color:"#10B981",fontSize:10}}>📝 오늘 {todayDailyN}건</span>}
            <span style={{fontSize:10,display:"flex",alignItems:"center",gap:3,color:syncStatus==="saved"?"#10B981":syncStatus==="error"?"#F87171":syncStatus==="saving"?"#FBBF24":"#CBD5E1"}}>{syncStatus==="saving"?"⟳ 저장중":syncStatus==="saved"?"● 동기화됨":syncStatus==="error"?"● 오프라인":"● -"}</span>
            {todayN>0&&<span style={{color:"#FBBF24",fontSize:10}}>⏰ 오늘 {todayN}건</span>}
            {overdueN>0&&<span style={{color:"#F87171",fontSize:10}}>⚠ 지연 {overdueN}건</span>}
          </div>
        </div>
        {/* 탭 */}
        <div style={{display:"flex",gap:3,background:"#F8FAFC",padding:3,borderRadius:8,border:"1px solid #E2E8F0",flexShrink:isMobile?1:0,overflowX:isMobile?"auto":"visible",WebkitOverflowScrolling:"touch",maxWidth:isMobile?"100%":"none"}}>
          {TABS.map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)} style={{background:view===v?"#FFFFFF":"transparent",border:view===v?"1px solid #E2E8F0":"1px solid transparent",color:view===v?"#2563EB":"#64748B",fontSize:12,fontWeight:view===v?600:400,padding:isMobile?"8px 14px":"4px 12px",borderRadius:6,cursor:"pointer",boxShadow:view===v?"0 1px 2px rgba(0,0,0,0.06)":"none"}}>
              {l}
            </button>
          ))}
        </div>
        {/* 카테고리 필터 (칸반/일정에만) */}
        {(view==="kanban"||view==="schedule")&&!isMobile&&(
          <div style={{display:"flex",gap:4,flex:1,flexWrap:"wrap"}}>
            <button onClick={()=>setCatF("all")} style={{background:catF==="all"?"rgba(0,0,0,0.06)":"transparent",border:`1px solid ${catF==="all"?"#CBD5E1":"transparent"}`,color:catF==="all"?"#334155":"#64748B",fontSize:12,padding:"4px 11px",borderRadius:6,cursor:"pointer"}}>전체 ({projs.length})</button>
            {VIS_CATS.map(k=>{const c=CATS[k];const cnt=projs.filter(p=>p.category===k).length;return(
              <button key={k} onClick={()=>setCatF(k)} style={{background:catF===k?c.bg:"transparent",border:`1px solid ${catF===k?c.border:"transparent"}`,color:catF===k?c.color:"#64748B",fontSize:12,padding:"4px 11px",borderRadius:6,cursor:"pointer",fontWeight:catF===k?600:400}}>
                {c.icon} {c.label}{cnt>0?` (${cnt})`:""}
              </button>);})}
          </div>
        )}
        {(view==="meeting"||view==="vendor"||view==="daily")&&<div style={{flex:1}}/>}
        {/* 추가 버튼 */}
        {view==="vendor"&&<button onClick={()=>setVModal({})} style={{background:"linear-gradient(135deg,#6D28D9,#4338CA)",border:"none",color:"#fff",fontSize:13,fontWeight:600,padding:"7px 15px",borderRadius:8,cursor:"pointer",display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",flexShrink:0}}><Plus size={14}/>업체 추가</button>}
      </div>
      {/* ── 콘텐츠 ── */}
      <div style={{paddingTop:13}}>
        {view==="kanban"&&<KanbanView projects={filProjs} subGroups={subs} tasks={tasks} selProjId={selP} setSelProjId={setSelP} selSubId={selS} setSelSubId={setSelS}
          onProjModal={p=>setPModal(p||{})} onSubModal={s=>setSModal(s||{projectId:selP})} onTaskModal={t=>setTModal(t||{subGroupId:selS})}
          onDelProj={delProj} onDelSub={delSub} onDelTask={delTask} onMoveTask={moveTask} isMobile={isMobile} dailies={dailies} projs={projs} onSaveDaily={saveDailyEntry} onDelDaily={delDailyEntry}/>}
        {view==="schedule"&&<ScheduleView tasks={filTasks} subGroups={subs} projects={projs} dailies={dailies} onEdit={t=>setTModal(t)} isMobile={isMobile}/>}
        {view==="meeting"&&<MeetingView tasks={tasks} subGroups={subs} projects={projs} schedules={schedules} onEditTask={t=>setTModal(t)} onSchedModal={s=>setSchModal(s||{})} onDelSched={delSched} isMobile={isMobile}/>}
        {view==="daily"&&<DailyView dailies={dailies} onSave={saveDailyEntry} onDelete={delDailyEntry} projs={projs} subs={subs} isMobile={isMobile}/>}
        {view==="vendor"&&<VendorView vendors={vendors} projs={projs} subs={subs} tasks={tasks} onEdit={setVModal} onDelete={delVendor}/>}
      </div>
      {/* ── 모달 ── */}
      {pModal!==null&&<ProjModal proj={pModal} vendors={vendors} onSave={saveProj} onClose={()=>setPModal(null)}/>}
      {sModal!==null&&<SubModal sg={sModal} parentName={sModal.projectId?projs.find(p=>p.id===sModal.projectId)?.name:null} vendors={vendors} onSave={saveSub} onClose={()=>setSModal(null)}/>}
      {tModal!==null&&<TaskModal task={tModal} projName={tCtx.projName} subName={tCtx.sgName} vendors={vendors} allSubs={subs} allProjs={projs} onSave={saveTask} onClose={()=>setTModal(null)}/>}
      {vModal!==null&&<VendorModal vendor={vModal} onSave={saveVendor} onClose={()=>setVModal(null)}/>}
      {schModal!==null&&<SchedModal sched={schModal} projects={projs} onSave={saveSched} onClose={()=>setSchModal(null)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
