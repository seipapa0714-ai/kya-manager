/* ── 칸반 뷰 ── */
const KanbanView=({projects,subGroups,tasks,selProjId,setSelProjId,selSubId,setSelSubId,onProjModal,onSubModal,onTaskModal,onDelProj,onDelSub,onDelTask,onMoveTask,isMobile=false})=>{
  const filtSubs=selProjId?subGroups.filter(s=>s.projectId===selProjId):[];
  const filtTasks=selSubId?tasks.filter(t=>t.subGroupId===selSubId):[];
  const priOrd={urgent:0,high:1,normal:2,low:3};
  const sorted=[...filtTasks].sort((a,b)=>{if(a.status==="done"&&b.status!=="done")return 1;if(a.status!=="done"&&b.status==="done")return-1;return priOrd[a.priority]-priOrd[b.priority];});
  const doneCnt=sorted.filter(t=>t.status==="done").length;
  const addBtn=(col,onClick,lbl)=><button onClick={onClick} style={{background:`${col}12`,border:`1px solid ${col}30`,color:col,fontSize:11,padding:"3px 9px",borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",gap:3}}><Plus size={10}/>{lbl}</button>;
  const colHdr=(lbl,col,btn)=><div style={{padding:"10px 12px 8px",borderBottom:"1px solid #E2E8F0",background:"#F8FAFC",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}><span style={{color:col,fontSize:11,fontWeight:700,letterSpacing:"0.8px",textTransform:"uppercase"}}>{lbl}</span>{btn}</div>;
  if(isMobile){
    const level=selSubId?2:selProjId?1:0;
    const selPO=projects.find(p=>p.id===selProjId);
    const selSO=subGroups.find(s=>s.id===selSubId);
    const backFn=()=>{if(level===2)setSelSubId(null);else{setSelProjId(null);setSelSubId(null);}};
    return(
      <div style={{height:"calc(100vh - 116px)",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"10px 14px",background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          {level>0&&<button onClick={backFn} style={{...sIBtn,padding:10,border:"1px solid #E2E8F0",borderRadius:7,color:"#2563EB",marginRight:4,minWidth:40,minHeight:40,justifyContent:"center"}}><ChevL size={18}/></button>}
          <div style={{flex:1,display:"flex",alignItems:"center",gap:5,overflow:"hidden",minWidth:0}}>
            {level===0&&<span style={{color:"#3B82F6",fontSize:15,fontWeight:700}}>📁 프로젝트</span>}
            {level>=1&&<span style={{color:"#1E293B",fontSize:15,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{selPO?.name}</span>}
            {level===1&&<span style={{color:"#A78BFA",fontSize:13,marginLeft:4,flexShrink:0,fontWeight:600}}>· 중분류</span>}
            {level===2&&<><span style={{color:"#CBD5E1",fontSize:16,flexShrink:0,marginLeft:2}}>›</span><span style={{color:"#1E293B",fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginLeft:4}}>{selSO?.name}</span></>}
          </div>
          <div style={{flexShrink:0}}>
            {level===0&&addBtn("#3B82F6",()=>onProjModal({}),"추가")}
            {level===1&&selProjId&&addBtn("#7C3AED",()=>onSubModal({projectId:selProjId}),"추가")}
            {level===2&&selSubId&&addBtn("#10B981",()=>onTaskModal({subGroupId:selSubId}),"추가")}
          </div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"8px 12px",WebkitOverflowScrolling:"touch"}}>
          {level===0&&<>
            {projects.length===0&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"50px 0",lineHeight:1.8}}>📁 대분류를 추가하세요<br/><span style={{fontSize:11}}>상단 추가 버튼을 눌러주세요</span></div>}
            {projects.map(p=><ProjRow key={p.id} proj={p} subGroups={subGroups} tasks={tasks} selected={selProjId===p.id} onSelect={()=>{setSelProjId(p.id);setSelSubId(null);}} onEdit={()=>onProjModal(p)} onDelete={()=>onDelProj(p.id)}/>)}
          </>}
          {level===1&&<>
            {filtSubs.length===0&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"50px 0",lineHeight:1.8}}>중분류를 추가하세요<br/><span style={{fontSize:11}}>상단 추가 버튼을 눌러주세요</span></div>}
            {filtSubs.map(sg=><SubRow key={sg.id} sg={sg} tasks={tasks} selected={selSubId===sg.id} onSelect={()=>setSelSubId(sg.id)} onEdit={()=>onSubModal(sg)} onDelete={()=>onDelSub(sg.id)}/>)}
          </>}
          {level===2&&<>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,paddingBottom:8,borderBottom:"1px solid #E2E8F0"}}>
              <span style={{color:"#10B981",fontSize:13,fontWeight:700}}>{sorted.filter(t=>t.status==="done").length}/{sorted.length} 완료</span>
            </div>
            {sorted.length===0&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"40px 0"}}>소분류를 추가하세요</div>}

    );
  }
  return(
    <div style={{display:"grid",gridTemplateColumns:"240px 220px 1fr",height:"calc(100vh - 116px)",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
      <div style={{borderRight:"1px solid #E2E8F0",display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {colHdr("대분류","#3B82F6",addBtn("#3B82F6",()=>onProjModal({}),"추가"))}
        <div style={{padding:"8px",overflowY:"auto",flex:1}}>
          {projects.length===0&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"24px 0",lineHeight:1.7}}>대분류를 추가하세요<br/><span style={{fontSize:10}}>예: 워치 만들기</span></div>}
          {projects.map(p=><ProjRow key={p.id} proj={p} subGroups={subGroups} tasks={tasks} selected={selProjId===p.id} onSelect={()=>{const n=p.id===selProjId?null:p.id;setSelProjId(n);setSelSubId(null);}} onEdit={()=>onProjModal(p)} onDelete={()=>onDelProj(p.id)}/>)}
        </div>
      </div>
      <div style={{borderRight:"1px solid #E2E8F0",display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {colHdr("중분류","#7C3AED",selProjId?addBtn("#7C3AED",()=>onSubModal({projectId:selProjId}),"추가"):null)}
        <div style={{padding:"8px",overflowY:"auto",flex:1}}>
          {!selProjId&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"24px 0",lineHeight:1.7}}>← 대분류를<br/>선택하세요</div>}
          {selProjId&&filtSubs.length===0&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"24px 0",lineHeight:1.7}}>중분류를 추가하세요<br/><span style={{fontSize:10}}>예: 기구설계, 업체선정</span></div>}
          {filtSubs.map(sg=><SubRow key={sg.id} sg={sg} tasks={tasks} selected={selSubId===sg.id} onSelect={()=>setSelSubId(sg.id===selSubId?null:sg.id)} onEdit={()=>onSubModal(sg)} onDelete={()=>onDelSub(sg.id)}/>)}
        </div>

      <div style={{display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"10px 12px 8px",borderBottom:"1px solid #E2E8F0",background:"#F8FAFC",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{color:"#10B981",fontSize:11,fontWeight:700,letterSpacing:"0.8px",textTransform:"uppercase"}}>소분류</span>
            {sorted.length>0&&<span style={{color:"#94A3B8",fontSize:11}}>{doneCnt}/{sorted.length} 완료</span>}
          </div>
          {selSubId&&addBtn("#10B981",()=>onTaskModal({subGroupId:selSubId}),"추가")}
        </div>
        <div style={{padding:"8px 10px",overflowY:"auto",flex:1}}>
          {!selSubId&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"24px 0",lineHeight:1.7}}>← 중분류를<br/>선택하세요</div>}
          {selSubId&&sorted.length===0&&<div style={{color:"#CBD5E1",fontSize:12,textAlign:"center",padding:"24px 0",lineHeight:1.7}}>소분류를 추가하세요<br/><span style={{fontSize:10}}>개별 업무 항목</span></div>}
          {sorted.map(t=><TaskRow key={t.id} task={t} onEdit={()=>onTaskModal(t)} onDelete={()=>onDelTask(t.id)} onMove={onMoveTask}/>)}
        </div>
      </div>
    </div>
  );
};


/* ── 일정 뷰 ── */
const SchedItem=({task,subGroups,projects,onEdit})=>{
  const sg=subGroups.find(s=>s.id===task.subGroupId);
  const proj=sg?projects.find(p=>p.id===sg.projectId):null;
  const cat=proj?.category||"project";
  const c=CATS[cat]||CATS.project;
  const d=getDday(task.deadline);
  return(
    <div onClick={()=>onEdit(task)} style={{background:"#FFFFFF",border:"1px solid #E2E8F0",borderLeft:`3px solid ${task.isMeeting?"#A78BFA":c.color}`,borderRadius:8,padding:"8px 12px",marginBottom:6,cursor:"pointer",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
      {proj&&<span style={{background:c.bg,border:`1px solid ${c.border}`,color:c.color,fontSize:11,padding:"2px 7px",borderRadius:4,fontWeight:600,whiteSpace:"nowrap"}}>{c.icon} {proj.name}</span>}
      {sg&&<span style={{color:"#94A3B8",fontSize:11,whiteSpace:"nowrap"}}>/ {sg.name}</span>}
      {task.isMeeting&&<span style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.25)",color:"#7C3AED",fontSize:10,padding:"1px 5px",borderRadius:3,fontWeight:700,flexShrink:0}}>📅 회의</span>}
      <PriDot pri={task.priority}/>
      <span style={{color:"#1E293B",fontSize:13,flex:1,minWidth:100}}>{task.title}</span>
      {task.meetingTime&&<span style={{color:"#7C3AED",fontSize:11,flexShrink:0}}>🕐 {task.meetingTime}</span>}
      {d!==null&&<span style={{color:ddayCl(d),fontSize:11,fontFamily:"monospace",fontWeight:d<=3?600:400,flexShrink:0}}>{fmtDday(d)}</span>}
      <span style={{background:`${STATUS_COL[task.status]}18`,border:`1px solid ${STATUS_COL[task.status]}40`,color:STATUS_COL[task.status],fontSize:11,padding:"2px 7px",borderRadius:4,flexShrink:0}}>{STATUS_LBL[task.status]}</span>
    </div>
  );
};
const ScheduleView=({tasks,subGroups,projects,onEdit,isMobile=false})=>{
  const [tab,setTab]=useState("daily");
  const [cur,setCur]=useState(new Date());
  const nav=dir=>{const d=new Date(cur);if(tab==="daily")d.setDate(d.getDate()+dir);else if(tab==="weekly")d.setDate(d.getDate()+dir*7);else if(tab==="monthly")d.setMonth(d.getMonth()+dir);else d.setMonth(d.getMonth()+dir*3);setCur(d);};
  const byDate=ds=>tasks.filter(t=>t.deadline===ds);
  const kd=["일","월","화","수","목","금","토"];
  const hdrLbl=()=>{
    if(tab==="daily")return`${cur.getFullYear()}년 ${cur.getMonth()+1}월 ${cur.getDate()}일 (${kd[cur.getDay()]})`;
    if(tab==="weekly"){const w=getWeek(cur),s=toDate(w[0]),e=toDate(w[6]);return`${s.getMonth()+1}/${s.getDate()} ~ ${e.getMonth()+1}/${e.getDate()}`;}
    if(tab==="monthly")return`${cur.getFullYear()}년 ${MONTH_LBL[cur.getMonth()]}`;
    return`${cur.getFullYear()}년 Q${Math.floor(cur.getMonth()/3)+1}`;
  };
  const getProj=t=>{const sg=subGroups.find(s=>s.id===t.subGroupId);return sg?projects.find(p=>p.id===sg.projectId):null;};
  const getCatColor=t=>{const p=getProj(t);return p?(CATS[p.category]||CATS.project).color:"#60A5FA";};
  const DailyR=()=>{
    const ds=cur.toISOString().slice(0,10),dt=byDate(ds);
    const inP=tasks.filter(t=>t.status==="inprogress"&&t.deadline!==ds);
    const ov=tasks.filter(t=>t.status!=="done"&&t.deadline&&getDday(t.deadline)<0&&t.deadline!==ds);
    return(<div style={{padding:"0 14px"}}>
      {ov.length>0&&<div style={{marginBottom:14}}><div style={{color:"#F87171",fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:9,textTransform:"uppercase",display:"flex",alignItems:"center",gap:5}}><AlertTri size={12}/>기한 초과 ({ov.length})</div>{ov.map(t=><SchedItem key={t.id} task={t} subGroups={subGroups} projects={projects} onEdit={onEdit}/>)}</div>}
      <div style={{marginBottom:14}}><div style={{color:"#3B82F6",fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:9,textTransform:"uppercase"}}>오늘 마감 ({dt.length})</div>
        {dt.length===0?<div style={{color:"#CBD5E1",fontSize:12,padding:"12px 0"}}>마감 업무 없음</div>:dt.map(t=><SchedItem key={t.id} task={t} subGroups={subGroups} projects={projects} onEdit={onEdit}/>)}</div>
      {inP.length>0&&<div><div style={{color:"#FBBF24",fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:9,textTransform:"uppercase"}}>진행 중 ({inP.length})</div>{inP.map(t=><SchedItem key={t.id} task={t} subGroups={subGroups} projects={projects} onEdit={onEdit}/>)}</div>}
    </div>);
  };
  const WeeklyR=()=>{
    const days=getWeek(cur),td=todayStr();
    return(<div style={{padding:"0 14px",display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:7}}>
      {days.map((ds,i)=>{const dt=toDate(ds),isT=ds===td,isW=i>=5,items=byDate(ds);return(
        <div key={ds} style={{background:isT?"rgba(59,130,246,0.05)":"#FFFFFF",border:isT?"1px solid rgba(59,130,246,0.2)":"1px solid #E2E8F0",borderRadius:8,overflow:"hidden",minHeight:130}}>
          <div style={{padding:"7px 6px",textAlign:"center",borderBottom:"1px solid #E2E8F0",background:isT?"rgba(59,130,246,0.08)":"#F8FAFC"}}>
            <div style={{color:isW?"#F87171":"#94A3B8",fontSize:11,fontWeight:600}}>{WDAY_LBL[i]}</div>
            <div style={{color:isT?"#2563EB":isW?"#F87171":"#334155",fontSize:17,fontWeight:700,fontFamily:"monospace"}}>{dt.getDate()}</div>
          </div>
          <div style={{padding:5}}>{items.map(t=><div key={t.id} onClick={()=>onEdit(t)} style={{background:`${getCatColor(t)}15`,border:`1px solid ${getCatColor(t)}30`,color:getCatColor(t),fontSize:10,padding:"2px 5px",borderRadius:3,marginBottom:3,cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.isMeeting?"📅 ":""}{t.title}</div>)}</div>
        </div>);})}
    </div>);
  };
  const MonthlyR=()=>{
    const y=cur.getFullYear(),m=cur.getMonth(),grid=getMonthGrid(y,m),td=todayStr();
    return(<div style={{padding:"0 14px"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:3}}>
        {WDAY_LBL.map((l,i)=><div key={l} style={{textAlign:"center",color:i>=5?"#F87171":"#94A3B8",fontSize:11,fontWeight:600,padding:"3px 0"}}>{l}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {grid.map((ds,i)=>{
          if(!ds)return<div key={i} style={{minHeight:62,background:"rgba(0,0,0,0.01)",borderRadius:5}}/>;
          const dt=toDate(ds),isT=ds===td,isW=i%7>=5,items=byDate(ds);
          return(<div key={ds} style={{background:isT?"rgba(59,130,246,0.05)":"#FFFFFF",border:isT?"1px solid rgba(59,130,246,0.2)":"1px solid #E2E8F0",borderRadius:5,padding:5,minHeight:62}}>
            <div style={{color:isT?"#2563EB":isW?"#F87171":"#94A3B8",fontSize:12,fontWeight:isT?700:400,fontFamily:"monospace",marginBottom:3}}>{dt.getDate()}</div>
            {items.slice(0,3).map(t=><div key={t.id} title={t.title} style={{height:4,background:getCatColor(t),borderRadius:2,marginBottom:2,opacity:0.7}}/>)}
            {items.length>3&&<div style={{color:"#94A3B8",fontSize:10}}>+{items.length-3}</div>}
          </div>);
        })}
      </div>
    </div>);
  };
  const QuarterlyR=()=>{
    const q=Math.floor(cur.getMonth()/3),y=cur.getFullYear(),months=[q*3,q*3+1,q*3+2];
    const now=new Date();now.setHours(0,0,0,0);
    return(<div style={{padding:"0 14px",display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
      {months.map(m=>{
        const mT=tasks.filter(t=>{if(!t.deadline)return false;const d=toDate(t.deadline);return d.getFullYear()===y&&d.getMonth()===m;}).sort((a,b)=>a.deadline.localeCompare(b.deadline));
        const isCur=y===now.getFullYear()&&m===now.getMonth(),isPast=new Date(y,m+1,0)<now;
        return(<div key={m} style={{background:isCur?"rgba(59,130,246,0.04)":"#FFFFFF",border:isCur?"1px solid rgba(59,130,246,0.15)":"1px solid #E2E8F0",borderRadius:10,padding:13}}>
          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
            <span style={{color:isCur?"#2563EB":isPast?"#CBD5E1":"#334155",fontSize:15,fontWeight:700}}>{MONTH_LBL[m]}</span>
            {isCur&&<span style={{fontSize:10,background:"rgba(59,130,246,0.1)",color:"#2563EB",padding:"1px 6px",borderRadius:4}}>현재</span>}
          </div>
          {mT.length===0?<div style={{color:"#CBD5E1",fontSize:11,padding:"10px 0",textAlign:"center"}}>업무 없음</div>:
            mT.slice(0,10).map(t=>{const d=getDday(t.deadline);const pj=getProj(t);return(
              <div key={t.id} onClick={()=>onEdit(t)} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 0",borderBottom:"1px solid #F8FAFC",cursor:"pointer"}}>
                <PriDot pri={t.priority}/>
                <span style={{color:"#475569",fontSize:12,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pj?`[${pj.name}] `:""}{t.title}</span>
                <span style={{color:ddayCl(d),fontSize:10,fontFamily:"monospace",flexShrink:0}}>{t.deadline&&t.deadline.slice(5).replace("-","/")}</span>
              </div>);})
          }
          {mT.length>10&&<div style={{color:"#94A3B8",fontSize:11,marginTop:5}}>외 {mT.length-10}건</div>}
        </div>);
      })}
    </div>);
  };
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 14px 12px",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:4,overflowX:isMobile?"auto":"visible",WebkitOverflowScrolling:"touch"}}>
          {SCHED_TABS.map(t=><button key={t} onClick={()=>setTab(t)} style={{background:tab===t?"rgba(59,130,246,0.1)":"rgba(0,0,0,0.02)",border:`1px solid ${tab===t?"rgba(59,130,246,0.25)":"#E2E8F0"}`,color:tab===t?"#2563EB":"#64748B",fontSize:12,fontWeight:tab===t?700:400,padding:"5px 14px",borderRadius:6,cursor:"pointer"}}>{SCHED_LBL[t]}</button>)}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>nav(-1)} style={{...sIBtn,color:"#94A3B8",padding:4}}><ChevL size={15}/></button>
          <span style={{color:"#334155",fontSize:12,fontFamily:"monospace",minWidth:165,textAlign:"center"}}>{hdrLbl()}</span>
          <button onClick={()=>nav(1)} style={{...sIBtn,color:"#94A3B8",padding:4}}><ChevR size={15}/></button>
          <button onClick={()=>setCur(new Date())} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",color:"#2563EB",fontSize:11,padding:"4px 10px",borderRadius:6,cursor:"pointer"}}>오늘</button>
        </div>
      </div>
      <div style={{overflowY:"auto",height:"calc(100vh - 168px)"}}>
        {tab==="daily"&&DailyR()}
        {tab==="weekly"&&WeeklyR()}
        {tab==="monthly"&&MonthlyR()}
        {tab==="quarterly"&&QuarterlyR()}
      </div>
    </div>
  );
};


/* ── 정기 일정 모달 ── */
const SchedModal=({sched,projects,onSave,onClose})=>{
  const [f,setF]=useState({...EMPTY_SCHED,...sched});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const toggleDay=d=>setF(p=>({...p,repeatDays:p.repeatDays.includes(d)?p.repeatDays.filter(x=>x!==d):[...p.repeatDays,d].sort()}));
  const save=()=>{if(!f.title.trim())return;onSave({...f,id:f.id||uid(),createdAt:f.createdAt||new Date().toISOString()});};

      </div>
    </div>
  );
};

/* ── 데일리 엔트리 카드 ── */
const DailyEntry=({entry,projs,subs,onEdit,onDelete})=>{
  const proj=entry.projId?projs.find(p=>p.id===entry.projId):null;
  const sub=entry.subId?subs.find(s=>s.id===entry.subId):null;
  const projName=proj?.name||entry.projText||"";
  const subName=sub?.name||entry.subText||"";
  const c=CATS[proj?.category]||CATS.project;
  return(
    <div style={{background:"#FFFFFF",border:"1px solid #E2E8F0",borderLeft:`3px solid ${projName?c.color:"#E2E8F0"}`,borderRadius:8,padding:"10px 13px",marginBottom:7}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:entry.content?6:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6,flex:1,minWidth:0,flexWrap:"wrap"}}>
          {projName&&<span style={{background:c.bg,border:`1px solid ${c.border}`,color:c.color,fontSize:11,padding:"2px 7px",borderRadius:4,fontWeight:600,whiteSpace:"nowrap"}}>{c.icon} {projName}</span>}
          {subName&&<span style={{color:"#94A3B8",fontSize:11,whiteSpace:"nowrap"}}>/ {subName}</span>}
          {entry.duration&&<span style={{background:"rgba(0,0,0,0.04)",color:"#64748B",fontSize:11,padding:"2px 7px",borderRadius:4,whiteSpace:"nowrap"}}>⏱ {entry.duration}</span>}
        </div>
        <div style={{display:"flex",gap:3,flexShrink:0}}>
          <button onClick={()=>onEdit(entry)} style={sIBtn}><Edit2 size={12}/></button>

        </div>
      </div>
      {entry.content&&<div style={{color:"#334155",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{entry.content}</div>}

  );
};

/* ── 데일리 입력 폼 (인라인) ── */
const DailyForm=({init,date,projs,subs,onSave,onCancel})=>{
  const [mode,setMode]=useState(init?.projId?"existing":init?.projText?"custom":"existing");
  const [f,setF]=useState({date:init?.date||date,projId:init?.projId||"",projText:init?.projText||"",subId:init?.subId||"",subText:init?.subText||"",content:init?.content||"",duration:init?.duration||""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const selProj=f.projId?projs.find(p=>p.id===f.projId):null;
  const relSubs=selProj?subs.filter(s=>s.projectId===selProj.id):[];
  const handleSave=()=>{if(!f.content.trim())return;onSave({...f,id:init?.id||uid(),createdAt:init?.createdAt||new Date().toISOString()});};
  const switchMode=m=>{setMode(m);if(m==="existing")setF(p=>({...p,projText:"",subText:""}));else setF(p=>({...p,projId:"",subId:""}));};
  const selStyle=(active)=>({background:active?"rgba(59,130,246,0.1)":"rgba(0,0,0,0.03)",border:`1px solid ${active?"rgba(59,130,246,0.3)":"#E2E8F0"}`,color:active?"#2563EB":"#64748B",fontSize:11,padding:"3px 10px",borderRadius:5,cursor:"pointer",fontWeight:active?600:400});
  return(
    <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:14,marginBottom:10}}>
      {/* 모드 토글 */}
      <div style={{display:"flex",gap:5,marginBottom:11}}>
        <button onClick={()=>switchMode("existing")} style={selStyle(mode==="existing")}>기존 프로젝트</button>
        <button onClick={()=>switchMode("custom")} style={selStyle(mode==="custom")}>직접 입력</button>
      </div>
      {/* 프로젝트/중분류 선택 */}
      {mode==="existing"?(
        <div style={{display:"flex",gap:7,marginBottom:10,flexWrap:"wrap"}}>
          <select value={f.projId} onChange={e=>{set("projId",e.target.value);set("subId","");}} style={{...sInput,flex:"1 1 140px",fontSize:12,padding:"6px 10px",color:f.projId?"#0F172A":"#94A3B8"}}>
            <option value="">프로젝트 선택...</option>
            {projs.map(p=><option key={p.id} value={p.id}>{(CATS[p.category]||CATS.project).icon} {p.name}</option>)}
          </select>
          {selProj&&<select value={f.subId} onChange={e=>set("subId",e.target.value)} style={{...sInput,flex:"1 1 120px",fontSize:12,padding:"6px 10px",color:f.subId?"#0F172A":"#94A3B8"}}>
            <option value="">중분류 선택...</option>
            {relSubs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>}
        </div>
      ):(
        <div style={{display:"flex",gap:7,marginBottom:10,flexWrap:"wrap"}}>
          <input value={f.projText} onChange={e=>set("projText",e.target.value)} placeholder="프로젝트명 입력" style={{...sInput,flex:"1 1 140px",fontSize:12,padding:"6px 10px"}}/>
          <input value={f.subText} onChange={e=>set("subText",e.target.value)} placeholder="중분류 입력 (선택)" style={{...sInput,flex:"1 1 120px",fontSize:12,padding:"6px 10px"}}/>
        </div>
      )}
      <textarea value={f.content} onChange={e=>set("content",e.target.value)} placeholder="오늘 한 업무 내용을 입력하세요..." rows={3} style={{...sInput,resize:"vertical",lineHeight:1.55,marginBottom:8,fontSize:13}}/>
      <div style={{display:"flex",alignItems:"center",gap:7}}>
        <input value={f.duration} onChange={e=>set("duration",e.target.value)} placeholder="소요시간 예: 2h, 30m" style={{...sInput,flex:1,fontSize:12,padding:"6px 10px"}}/>
        <button onClick={onCancel} style={{background:"rgba(0,0,0,0.04)",border:"1px solid #E2E8F0",color:"#64748B",padding:"6px 14px",borderRadius:7,cursor:"pointer",fontSize:12,flexShrink:0}}>취소</button>
        <button onClick={handleSave} style={{background:f.content.trim()?"linear-gradient(135deg,#2563EB,#4F46E5)":"#E2E8F0",border:"none",color:f.content.trim()?"#fff":"#94A3B8",padding:"6px 16px",borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:600,flexShrink:0}}>저장</button>
      </div>
    </div>
  );
};

/* ── 데일리 뷰 ── */
const DailyView=({dailies,onSave,onDelete,projs,subs,isMobile=false})=>{
  const [mobilePane,setMobilePane]=useState("daily");
  const [curDate,setCurDate]=useState(todayStr());
  const [adding,setAdding]=useState(false);
  const [editId,setEditId]=useState(null);
  const [weekBase,setWeekBase]=useState(new Date());
  const weekDays=getWeek(weekBase);
  const dayEntries=dailies.filter(d=>d.date===curDate).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  const kd=["일","월","화","수","목","금","토"];
  const curDt=toDate(curDate);
  const dayLabel=`${curDt.getFullYear()}년 ${curDt.getMonth()+1}월 ${curDt.getDate()}일 (${kd[curDt.getDay()]})`;
  const navDay=dir=>{const d=new Date(curDate+"T00:00:00");d.setDate(d.getDate()+dir);const nd=d.toISOString().slice(0,10);setCurDate(nd);if(!weekDays.includes(nd))setWeekBase(d);};
  const navWeek=dir=>{const d=new Date(weekBase);d.setDate(d.getDate()+dir*7);setWeekBase(d);};
  const goToday=()=>{setCurDate(todayStr());setWeekBase(new Date());};
  const handleSave=entry=>{onSave({...entry,date:curDate});setAdding(false);setEditId(null);};
  const weekTotal=weekDays.reduce((a,d)=>a+dailies.filter(x=>x.date===d).length,0);
  const weekWorkDays=weekDays.filter(d=>dailies.some(x=>x.date===d)).length;
  return(
    <div style={{display:isMobile?"flex":"grid",flexDirection:isMobile?"column":"row",gridTemplateColumns:isMobile?"":"1fr 300px",height:isMobile?"auto":"calc(100vh - 116px)",overflowX:isMobile?"":"auto"}}>
      {isMobile&&<div style={{display:"flex",borderBottom:"1px solid #E2E8F0",background:"#F8FAFC",flexShrink:0}}><button onClick={()=>setMobilePane("daily")} style={{flex:1,padding:"11px",color:mobilePane==="daily"?"#2563EB":"#64748B",borderBottom:mobilePane==="daily"?"2px solid #2563EB":"2px solid transparent",fontWeight:mobilePane==="daily"?700:400,fontSize:13,background:"none",border:"none",cursor:"pointer",borderBottom:mobilePane==="daily"?"2px solid #2563EB":"2px solid transparent"}}>📝 일간</button><button onClick={()=>setMobilePane("weekly")} style={{flex:1,padding:"11px",color:mobilePane==="weekly"?"#2563EB":"#64748B",fontWeight:mobilePane==="weekly"?700:400,fontSize:13,background:"none",border:"none",cursor:"pointer",borderBottom:mobilePane==="weekly"?"2px solid #2563EB":"2px solid transparent"}}>📆 주간</button></div>}
      {/* ── 왼쪽: 일간 업무 ── */}
      <div style={{borderRight:isMobile?"none":"1px solid #E2E8F0",overflowY:"auto",padding:"0 16px",display:isMobile&&mobilePane!=="daily"?"none":"block"}}>
        {/* 날짜 네비게이션 */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,paddingTop:2,flexWrap:"wrap"}}>
          <button onClick={()=>navDay(-1)} style={{...sIBtn,padding:5,border:"1px solid #E2E8F0",borderRadius:6,color:"#64748B"}}><ChevL size={14}/></button>
          <span style={{color:"#1E293B",fontSize:14,fontWeight:700,flex:1,minWidth:180}}>{dayLabel}</span>
          <button onClick={()=>navDay(1)} style={{...sIBtn,padding:5,border:"1px solid #E2E8F0",borderRadius:6,color:"#64748B"}}><ChevR size={14}/></button>
          <button onClick={goToday} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",color:"#2563EB",fontSize:11,padding:"4px 10px",borderRadius:6,cursor:"pointer"}}>오늘</button>
        </div>
        {/* 추가 버튼 */}
        {!adding&&!editId&&<button onClick={()=>setAdding(true)} style={{width:"100%",background:"rgba(59,130,246,0.04)",border:"1px dashed rgba(59,130,246,0.25)",color:"#2563EB",padding:"9px",borderRadius:8,cursor:"pointer",fontSize:13,marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><Plus size={14}/>업무 추가</button>}
        {adding&&<DailyForm init={{date:curDate}} date={curDate} projs={projs} subs={subs} onSave={handleSave} onCancel={()=>setAdding(false)}/>}
        {/* 엔트리 목록 */}
        {dayEntries.length===0&&!adding&&<div style={{color:"#CBD5E1",fontSize:13,textAlign:"center",padding:"36px 0",lineHeight:1.8}}>📝 오늘 한 업무를 기록해보세요<br/><span style={{fontSize:11}}>업무 추가 버튼을 눌러 시작하세요</span></div>}
        {dayEntries.map(entry=>(
          editId===entry.id?(
            <DailyForm key={entry.id} init={entry} date={curDate} projs={projs} subs={subs} onSave={handleSave} onCancel={()=>setEditId(null)}/>

            <DailyEntry key={entry.id} entry={entry} projs={projs} subs={subs} onEdit={e=>{setEditId(e.id);setAdding(false);}} onDelete={()=>onDelete(entry.id)}/>

                  {isToday&&<span style={{background:"rgba(59,130,246,0.1)",color:"#2563EB",fontSize:9,padding:"1px 4px",borderRadius:3,fontWeight:700}}>오늘</span>}

                </div>);})}

            </div>

            <span style={{color:"#64748B",fontSize:12}}>{weekWorkDays}일 기록</span>
          </div>
          {weekWorkDays>0&&<div style={{marginTop:8,height:4,background:"#E2E8F0",borderRadius:2,overflow:"hidden"}}><div style={{width:`${(weekWorkDays/5)*100}%`,maxWidth:"100%",height:"100%",background:"linear-gradient(90deg,#2563EB,#4F46E5)",borderRadius:2,transition:"width 0.3s"}}/></div>}
          {weekTotal>0&&(()=>{
            const projCounts={};
            weekDays.forEach(d=>dailies.filter(x=>x.date===d).forEach(e=>{const pj=e.projId?projs.find(p=>p.id===e.projId):null;const k=pj?.name||e.projText||"기타";projCounts[k]=(projCounts[k]||0)+1;}));
            const top=Object.entries(projCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
            return top.length>0?(<div style={{marginTop:10}}>{top.map(([n,cnt])=>(<div key={n} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"3px 0",borderBottom:"1px solid #F1F5F9"}}><span style={{color:"#475569",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginRight:8}}>{n}</span><span style={{color:"#2563EB",fontSize:11,fontWeight:700,flexShrink:0}}>{cnt}건</span></div>))}</div>):null;
          })()}
        </div>
      </div>
    </div>
  );
};

/* ── 메인 앱 ── */
function App(){
  const [projs,setProjs]=useState([]);
  const [subs,setSubs]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [vendors,setVendors]=useState([]);
  const [schedules,setSchedules]=useState([]);
  const [dailies,setDailies]=useState([]);
  const [view,setView]=useState("kanban");
  const [catF,setCatF]=useState("all");
  const [selP,setSelP]=useState(null);
  const [selS,setSelS]=useState(null);
  const [pModal,setPModal]=useState(null);
  const [sModal,setSModal]=useState(null);
  const [tModal,setTModal]=useState(null);
  const [vModal,setVModal]=useState(null);
  const [schModal,setSchModal]=useState(null);
  const [loading,setLoading]=useState(true);
  const [syncStatus,setSyncStatus]=useState("idle"); // idle|saving|saved|error
  const fbTimer=useRef(null);
  const checkMobile=()=>window.innerWidth<1024||"ontouchstart" in window||navigator.maxTouchPoints>0;
  const [isMobile,setIsMobile]=useState(checkMobile);
  useEffect(()=>{const h=()=>setIsMobile(checkMobile());window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);

  useEffect(()=>{
    (async()=>{
      try{
        const res=await fetch(FB_URL);
        const fb=await res.json();
        if(fb&&typeof fb==="object"){
          if(Array.isArray(fb.projs))setProjs(fb.projs);
          if(Array.isArray(fb.subs))setSubs(fb.subs);
          if(Array.isArray(fb.tasks))setTasks(fb.tasks);
          if(Array.isArray(fb.vendors))setVendors(fb.vendors);
          if(Array.isArray(fb.schedules))setSchedules(fb.schedules);
          if(Array.isArray(fb.dailies))setDailies(fb.dailies);
        }
      }catch(e){
        // 오프라인 시 localStorage 폴백
        try{
          const p=localStorage.getItem("gd_projs_v1"),s=localStorage.getItem("gd_subs_v1"),t=localStorage.getItem("gd_tasks_v3"),v=localStorage.getItem("gd_vendors_v1"),sc=localStorage.getItem("gd_schedules_v1"),dl=localStorage.getItem("gd_dailies_v1");
          if(p)setProjs(JSON.parse(p));if(s)setSubs(JSON.parse(s));if(t)setTasks(JSON.parse(t));if(v)setVendors(JSON.parse(v));if(sc)setSchedules(JSON.parse(sc));if(dl)setDailies(JSON.parse(dl));
        }catch(e2){}
      }
      setLoading(false);
    })();
  },[]);

  // 데이터 변경 시 Firebase 자동 저장 (1초 디바운스)
  useEffect(()=>{
    if(loading)return;
    setSyncStatus("saving");
    clearTimeout(fbTimer.current);
    fbTimer.current=setTimeout(async()=>{
      try{
        await fetch(FB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({projs,subs,tasks,vendors,schedules,dailies})});
        setSyncStatus("saved");
        // localStorage 백업도 동시 저장
        try{localStorage.setItem("gd_projs_v1",JSON.stringify(projs));localStorage.setItem("gd_subs_v1",JSON.stringify(subs));localStorage.setItem("gd_tasks_v3",JSON.stringify(tasks));localStorage.setItem("gd_vendors_v1",JSON.stringify(vendors));localStorage.setItem("gd_schedules_v1",JSON.stringify(schedules));localStorage.setItem("gd_dailies_v1",JSON.stringify(dailies));}catch(le){}
      }catch(e){
        setSyncStatus("error");
      }
    },1000);
    return()=>clearTimeout(fbTimer.current);
  },[projs,subs,tasks,vendors,schedules,dailies,loading]);

  const pp=a=>{try{localStorage.setItem("gd_projs_v1",JSON.stringify(a));}catch(e){}};
  const ps=a=>{try{localStorage.setItem("gd_subs_v1",JSON.stringify(a));}catch(e){}};
  const pt=a=>{try{localStorage.setItem("gd_tasks_v3",JSON.stringify(a));}catch(e){}};
  const pv=a=>{try{localStorage.setItem("gd_vendors_v1",JSON.stringify(a));}catch(e){}};
  const psc=a=>{try{localStorage.setItem("gd_schedules_v1",JSON.stringify(a));}catch(e){}};
  const pdl=a=>{try{localStorage.setItem("gd_dailies_v1",JSON.stringify(a));}catch(e){}};

  const saveProj=p=>{const n=!projs.find(x=>x.id===p.id)?[...projs,p]:projs.map(x=>x.id===p.id?p:x);setProjs(n);pp(n);setPModal(null);};
  const delProj=id=>{if(!confirm("대분류와 모든 하위 업무가 삭제됩니다."))return;const dIds=subs.filter(s=>s.projectId===id).map(s=>s.id);const nt=tasks.filter(t=>!dIds.includes(t.subGroupId));const ns=subs.filter(s=>s.projectId!==id);const np=projs.filter(p=>p.id!==id);setProjs(np);pp(np);setSubs(ns);ps(ns);setTasks(nt);pt(nt);if(selP===id){setSelP(null);setSelS(null);}};
  const saveSub=s=>{const n=!subs.find(x=>x.id===s.id)?[...subs,s]:subs.map(x=>x.id===s.id?s:x);setSubs(n);ps(n);setSModal(null);};
  const delSub=id=>{if(!confirm("중분류와 모든 소분류가 삭제됩니다."))return;const nt=tasks.filter(t=>t.subGroupId!==id);const ns=subs.filter(s=>s.id!==id);setSubs(ns);ps(ns);setTasks(nt);pt(nt);if(selS===id)setSelS(null);};
  const saveTask=t=>{const n=!tasks.find(x=>x.id===t.id)?[...tasks,t]:tasks.map(x=>x.id===t.id?t:x);setTasks(n);pt(n);setTModal(null);};
  const delTask=id=>{if(!confirm("삭제하시겠습니까?"))return;const n=tasks.filter(t=>t.id!==id);setTasks(n);pt(n);};
  const moveTask=(id,status)=>{const n=tasks.map(t=>t.id===id?{...t,status}:t);setTasks(n);pt(n);};
  const saveVendor=v=>{const n=!vendors.find(x=>x.id===v.id)?[...vendors,v]:vendors.map(x=>x.id===v.id?v:x);setVendors(n);pv(n);setVModal(null);};
  const delVendor=id=>{if(!confirm("협력업체를 삭제하시겠습니까?"))return;const n=vendors.filter(v=>v.id!==id);setVendors(n);pv(n);};
  const saveSched=s=>{const n=!schedules.find(x=>x.id===s.id)?[...schedules,s]:schedules.map(x=>x.id===s.id?s:x);setSchedules(n);psc(n);setSchModal(null);};
  const delSched=id=>{if(!confirm("삭제하시겠습니까?"))return;const n=schedules.filter(s=>s.id!==id);setSchedules(n);psc(n);};
  const saveDailyEntry=e=>{const n=!dailies.find(x=>x.id===e.id)?[...dailies,e]:dailies.map(x=>x.id===e.id?e:x);setDailies(n);pdl(n);};
  const delDailyEntry=id=>{if(!confirm("삭제하시겠습니까?"))return;const n=dailies.filter(d=>d.id!==id);setDailies(n);pdl(n);};

  const filProjs=catF==="all"?projs:projs.filter(p=>p.category===catF);
  const filTasks=tasks.filter(t=>{const sg=subs.find(s=>s.id===t.subGroupId);if(!sg)return false;return catF==="all"||filProjs.some(p=>p.id===sg.projectId);});

  const totalT=tasks.length,meetingN=tasks.filter(t=>t.isMeeting).length,todayDailyN=dailies.filter(d=>d.date===todayStr()).length;
  const overdueN=tasks.filter(t=>t.status!=="done"&&t.deadline&&getDday(t.deadline)<0).length;
  const todayN=tasks.filter(t=>t.status!=="done"&&t.deadline===todayStr()).length;

  const getCtx=t=>{const sg=subs.find(s=>s.id===t.subGroupId);const pj=sg?projs.find(p=>p.id===sg.projectId):null;return{sgName:sg?.name,projName:pj?.name};};

  const TABS=[["kanban","⊞  칸반"],["schedule","📅  일정"],["meeting","🗓  회의/일정"],["daily","📝  데일리"],["vendor","🏭  협력업체"]];

  if(loading)return<div style={{background:"#F0F4F9",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,color:"#94A3B8",fontFamily:"system-ui"}}><div style={{width:32,height:32,border:"3px solid #E2E8F0",borderTop:"3px solid #2563EB",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/><style>{"@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}"}</style><span style={{fontSize:13}}>Firebase에서 불러오는 중...</span></div>;

  const tCtx=tModal?getCtx(tModal):{};

  return(
    <div style={{background:"#F0F4F9",minHeight:"100vh",fontFamily:"'Noto Sans KR',sans-serif",color:"#1E293B"}}>
      {/* ── 헤더 ── */}
      <div style={{display:"flex",alignItems:"center",padding:isMobile?"7px 10px":"9px 14px",borderBottom:"1px solid #E2E8F0",background:"#FFFFFF",gap:isMobile?6:10,flexWrap:"wrap",position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <div style={{marginRight:4,flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:16}}>⚙️</span>
            <span style={{color:"#0F172A",fontSize:14,fontWeight:700,letterSpacing:"0.3px"}}>유안 업무</span>
          </div>
          <div style={{display:"flex",gap:8,marginTop:1}}>
            <span style={{color:"#CBD5E1",fontSize:10,fontFamily:"monospace"}}>업무 {totalT} · 업체 {vendors.length}</span>
            {meetingN>0&&<span style={{color:"#7C3AED",fontSize:10}}>📅 회의 {meetingN}건</span>}{todayDailyN>0&&<span style={{color:"#10B981",fontSize:10}}>📝 오늘 {todayDailyN}건</span>}
            <span style={{fontSize:10,display:"flex",alignItems:"center",gap:3,color:syncStatus==="saved"?"#10B981":syncStatus==="error"?"#F87171":syncStatus==="saving"?"#FBBF24":"#CBD5E1"}}>{syncStatus==="saving"?"⟳ 저장중":syncStatus==="saved"?"● 동기화됨":syncStatus==="error"?"● 오프라인":"● -"}</span>
            {todayN>0&&<span style={{color:"#FBBF24",fontSize:10}}>⏰ 오늘 {todayN}건</span>}
            {overdueN>0&&<span style={{color:"#F87171",fontSize:10}}>⚠ 지연 {overdueN}건</span>}
          </div>
        </div>
        {/* 탭 */}
        <div style={{display:"flex",gap:3,background:"#F8FAFC",padding:3,borderRadius:8,border:"1px solid #E2E8F0",flexShrink:isMobile?1:0,overflowX:isMobile?"auto":"visible",WebkitOverflowScrolling:"touch",maxWidth:isMobile?"100%":"none"}}>
          {TABS.map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)} style={{background:view===v?"#FFFFFF":"transparent",border:view===v?"1px solid #E2E8F0":"1px solid transparent",color:view===v?"#2563EB":"#64748B",fontSize:12,fontWeight:view===v?600:400,padding:isMobile?"8px 14px":"4px 12px",borderRadius:6,cursor:"pointer",boxShadow:view===v?"0 1px 2px rgba(0,0,0,0.06)":"none"}}>
              {l}
            </button>
          ))}
        </div>
        {/* 카테고리 필터 (칸반/일정에만) */}
        {(view==="kanban"||view==="schedule")&&!isMobile&&(
          <div style={{display:"flex",gap:4,flex:1,flexWrap:"wrap"}}>
            <button onClick={()=>setCatF("all")} style={{background:catF==="all"?"rgba(0,0,0,0.06)":"transparent",border:`1px solid ${catF==="all"?"#CBD5E1":"transparent"}`,color:catF==="all"?"#334155":"#64748B",fontSize:12,padding:"4px 11px",borderRadius:6,cursor:"pointer"}}>전체 ({projs.length})</button>
            {VIS_CATS.map(k=>{const c=CATS[k];const cnt=projs.filter(p=>p.category===k).length;return(
              <button key={k} onClick={()=>setCatF(k)} style={{background:catF===k?c.bg:"transparent",border:`1px solid ${catF===k?c.border:"transparent"}`,color:catF===k?c.color:"#64748B",fontSize:12,padding:"4px 11px",borderRadius:6,cursor:"pointer",fontWeight:catF===k?600:400}}>
                {c.icon} {c.label}{cnt>0?` (${cnt})`:""}
              </button>);})}
          </div>
        )}
        {(view==="meeting"||view==="vendor"||view==="daily")&&<div style={{flex:1}}/>}
        {/* 추가 버튼 */}
        {view==="vendor"&&<button onClick={()=>setVModal({})} style={{background:"linear-gradient(135deg,#6D28D9,#4338CA)",border:"none",color:"#fff",fontSize:13,fontWeight:600,padding:"7px 15px",borderRadius:8,cursor:"pointer",display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",flexShrink:0}}><Plus size={14}/>업체 추가</button>}
      </div>
      {/* ── 콘텐츠 ── */}
      <div style={{paddingTop:13}}>
        {view==="kanban"&&<KanbanView projects={filProjs} subGroups={subs} tasks={tasks} selProjId={selP} setSelProjId={setSelP} selSubId={selS} setSelSubId={setSelS}
          onProjModal={p=>setPModal(p||{})} onSubModal={s=>setSModal(s||{projectId:selP})} onTaskModal={t=>setTModal(t||{subGroupId:selS})}
          onDelProj={delProj} onDelSub={delSub} onDelTask={delTask} onMoveTask={moveTask} isMobile={isMobile}/>}
        {view==="schedule"&&<ScheduleView tasks={filTasks} subGroups={subs} projects={projs} onEdit={t=>setTModal(t)} isMobile={isMobile}/>}
        {view==="meeting"&&<MeetingView tasks={tasks} subGroups={subs} projects={projs} schedules={schedules} onEditTask={t=>setTModal(t)} onSchedModal={s=>setSchModal(s||{})} onDelSched={delSched} isMobile={isMobile}/>}
        {view==="daily"&&<DailyView dailies={dailies} onSave={saveDailyEntry} onDelete={delDailyEntry} projs={projs} subs={subs} isMobile={isMobile}/>}
        {view==="vendor"&&<VendorView vendors={vendors} projs={projs} subs={subs} tasks={tasks} onEdit={setVModal} onDelete={delVendor}/>}
      </div>
      {/* ── 모달 ── */}
      {pModal!==null&&<ProjModal proj={pModal} vendors={vendors} onSave={saveProj} onClose={()=>setPModal(null)}/>}
      {sModal!==null&&<SubModal sg={sModal} parentName={sModal.projectId?projs.find(p=>p.id===sModal.projectId)?.name:null} vendors={vendors} onSave={saveSub} onClose={()=>setSModal(null)}/>}
      {tModal!==null&&<TaskModal task={tModal} projName={tCtx.projName} subName={tCtx.sgName} vendors={vendors} onSave={saveTask} onClose={()=>setTModal(null)}/>}
      {vModal!==null&&<VendorModal vendor={vModal} onSave={saveVendor} onClose={()=>setVModal(null)}/>}
      {schModal!==null&&<SchedModal sched={schModal} projects={projs} onSave={saveSched} onClose={()=>setSchModal(null)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
